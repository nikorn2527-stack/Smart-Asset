    <rect x="890" y="470" width="34" height="22" fill-opacity=".1"/><rect x="940" y="470" width="34" height="22" fill-opacity=".32"/><rect x="990" y="470" width="34" height="22" fill-opacity=".1"/><rect x="1040" y="470" width="34" height="22" fill-opacity=".28"/>
    <rect x="890" y="520" width="34" height="22" fill-opacity=".28"/><rect x="940" y="520" width="34" height="22" fill-opacity=".1"/><rect x="990" y="520" width="34" height="22" fill-opacity=".34"/><rect x="1040" y="520" width="34" height="22" fill-opacity=".12"/>
    <rect x="890" y="570" width="34" height="22" fill-opacity=".1"/><rect x="940" y="570" width="34" height="22" fill-opacity=".3"/><rect x="990" y="570" width="34" height="22" fill-opacity=".12"/><rect x="1040" y="570" width="34" height="22" fill-opacity=".3"/>
    <rect x="890" y="620" width="34" height="22" fill-opacity=".3"/><rect x="940" y="620" width="34" height="22" fill-opacity=".12"/><rect x="990" y="620" width="34" height="22" fill-opacity=".1"/><rect x="1040" y="620" width="34" height="22" fill-opacity=".34"/>
    <rect x="1140" y="600" width="40" height="22" fill-opacity=".26"/><rect x="1200" y="600" width="40" height="22" fill-opacity=".1"/><rect x="1260" y="600" width="40" height="22" fill-opacity=".3"/><rect x="1320" y="600" width="40" height="22" fill-opacity=".12"/>
    <rect x="1140" y="650" width="40" height="22" fill-opacity=".1"/><rect x="1200" y="650" width="40" height="22" fill-opacity=".3"/><rect x="1260" y="650" width="40" height="22" fill-opacity=".1"/><rect x="1320" y="650" width="40" height="22" fill-opacity=".28"/>
    <rect x="670" y="660" width="36" height="22" fill-opacity=".24"/><rect x="726" y="660" width="36" height="22" fill-opacity=".1"/><rect x="782" y="660" width="36" height="22" fill-opacity=".28"/>
