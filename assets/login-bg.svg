<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a3e"/>
      <stop offset=".55" stop-color="#123d56"/>
      <stop offset="1" stop-color="#0c6f72"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".78" cy=".22" r=".45">
      <stop offset="0" stop-color="#2fb5a9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2fb5a9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".15" cy=".95" r=".5">
      <stop offset="0" stop-color="#f6b25c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f6b25c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity=".09"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <!-- Building skyline: a tall clinical tower with lit windows, low wings either side. -->
  <g fill="url(#fade)" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5">
