[deploy]
startCommand = "python server.py"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "always"
restartPolicyMaxRetries = 10

[deploy.env]
PORT = "8080"
HOST = "0.0.0.0"
ASSET_DB_PATH = "/data/govasset.sqlite3"
REPAIR_APPROVAL_THRESHOLD = "5000"
PYTHONUNBUFFERED = "1"
TZ = "Asia/Bangkok"

[[deploy.volumes]]
name = "smart-asset-data"
mountPath = "/data"